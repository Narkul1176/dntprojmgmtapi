#Build and push the Docker image to ACR

#Name displayed on the GitHub Actions page for this workflow
name:Build and Push Docker Image to ACR

#Defines when this workflow should run
on:
#Run automatically whenever code is pushed to the main branch
push:
branches:
-main

#Also allow the workflow to bt started manually from the GitHub Actions page
workflow_dispatch:

#Permissions required by this workflow
permissions:
#Allows the workflow to read source code from repository
contents:read

#Allows GitHub Actions to request a temporary OIDC token
#for secure authentication with Miscrosoft azure
id-token:write

#Reusable values available to every job and step in this window
env:
#Values configured under GitHub Repository variables
ACR_NAME:${{vars.ACR_NAME}}

#Complete ACR login server details
ACR_LOGIN_SERVER:${{vars.ACR_LOGIN_SERVER}}

IMAGE_NAME:${{vars.IMAGE_NAME}}

DOCKERFILE_PATH:./dntprojmgmtapi/Dockerfile

BUILD_CONTEXT:./dntprojmgmtapi

jobs:
build-and-push:
name:Build and Push Docker Image
runs-on:ubuntu-latest
uses:actions/checkout@v6

-name:Login to Microsoft Azure using OIDC
uses:azure/login@v3
with:
client-id:${{secrets.AZURE_CLIENT_ID}}
tenant-id:${{secrets.AZURE_TENANT_ID}}
subscription-id:${{secrets.AZURE_SUBSCRIPTION_ID}}

-name:Get temporary ACR access token
run:
set -euo pipefail
ACR_TOKEN=$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)
echo "::add-mask::$ACR_TOKEN"
echo "token=$ACR_TOKEN" >> "$GITHUB_OUTPUT"

-name:Login to AZure ACR
uses:docker/login-action#v4
with:
registry:${{env.ACR_LOGIN_SERVER}}
username:00000000-0000-0000-0000-000000000000
password:${{steps.acr-token.outputs.token}}
-name:Set up Docker Buildx
uses:docker/setup-buildx-action@v4

-name:Build and push Docker image
uses:docker/build-push-action@v7
with:
context:${{env.BUILD_CONTEXT}}
file:${{env.DOCKERFILE_PATH}}
push:true
tags:
${{env.ACR_LOGIN_SERVER}}/${{env.IMAGE_NAME}}:latest
${{env.ACR_LOGIN_SERVER}}/${{env.IMAGE_NAME}}:${{GitHub.sha}}





